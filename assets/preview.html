<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>button-in-siyuan 预览</title>
<!--
    集市预览图图源：用 HTML 照抄本插件的实际渲染效果与思源 UI。
    颜色、字体、圆角、尺寸取自思源 daylight 主题与组件样式；图标为思源内置图标集
    （SiYuan，MIT License，Copyright (c) 2020-present, SiYuan）。
    改动后用 node scripts/render-preview.mjs 重新生成 assets/preview.png。
-->
<style>
    /* ===== 思源 daylight 主题变量 ===== */
    :root {
        --b3-theme-primary: #3575f0;
        --b3-theme-primary-lighter: rgba(53, 117, 240, .38);
        --b3-theme-primary-lightest: rgba(53, 117, 240, .12);
        --b3-theme-background: #fff;
        --b3-theme-surface: #f6f6f6;
        --b3-theme-surface-light: rgba(243, 243, 243, .86);
        --b3-theme-surface-lighter: #e0e0e0;
        --b3-theme-on-primary: #fff;
        --b3-theme-on-background: #222;
        --b3-theme-on-surface: #5f6368;
        --b3-body-background: #EBECF0;
        --b3-border-color: #e0e0e0;
        --b3-border-radius: 6px;
        --b3-border-radius-s: 3px;
        --b3-border-radius-b: 12px;
        --b3-list-hover: rgba(0, 0, 0, .075);
        --b3-menu-background: #fff;
        --b3-mask-background: rgba(220, 220, 220, .4);
        --b3-dialog-shadow: 0 8px 24px rgba(0, 0, 0, .2);
        --b3-protyle-code-background: rgba(27, 31, 35, .05);
        --b3-font-family: BlinkMacSystemFont, Helvetica, "PingFang SC", "Luxi Sans", "DejaVu Sans", arial, "Microsoft Yahei", "Hiragino Sans GB", "Source Han Sans SC", sans-serif;
        --b3-font-family-code: "JetBrainsMono-Regular", mononoki, Consolas, "Liberation Mono", monospace;
        --b3-font-size: 14px;
        --b3-select-background: url("data:image/svg+xml;utf8,<svg fill='rgba(95, 99, 104, .68)' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>") no-repeat right 2px center var(--b3-menu-background);
    }

    /* ===== 页面：1024×768，四个面板分别照抄插件的实际界面 ===== */
    body {
        width: 1024px;
        height: 768px;
        margin: 0;
        padding: 20px;
        overflow: hidden;
        box-sizing: border-box;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 384px 324px;
        gap: 20px;
        background-color: var(--b3-body-background);
        color: var(--b3-theme-on-background);
        font-family: var(--b3-font-family);
        font-size: var(--b3-font-size);
        -webkit-font-smoothing: antialiased;
    }

    .pane {
        position: relative;
        overflow: hidden;
        border-radius: var(--b3-border-radius-b);
        background-color: var(--b3-theme-background);
        border: 1px solid var(--b3-theme-surface-lighter);
        box-sizing: border-box;
    }

    .pane .scrim {
        position: absolute;
        inset: 0;
        background-color: var(--b3-mask-background);
    }

    /* ===== 思源组件样式（取自 component/_button.scss、_text-field.scss、_select.scss、_dialog.scss、_menu.scss） ===== */
    .svg {
        fill: currentColor;
        display: inline-block;
        stroke-width: 0;
        stroke: currentColor;
        width: 16px;
        height: 16px;
        flex-shrink: 0;
    }

    .b3-button {
        cursor: pointer;
        color: var(--b3-theme-on-primary);
        border-radius: var(--b3-border-radius);
        line-height: 20px;
        padding: 4px 8px;
        background-color: var(--b3-theme-primary);
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        box-sizing: border-box;
        text-align: center;
    }

    .b3-button svg {
        height: 16px;
        width: 16px;
        margin-right: 4px;
        flex-shrink: 0;
    }

    .b3-button--outline {
        color: var(--b3-theme-primary);
        box-shadow: inset 0 0 0 .6px var(--b3-theme-primary);
        background-color: transparent;
    }

    .b3-button--cancel {
        color: var(--b3-theme-on-surface);
        background-color: transparent;
    }

    .b3-button--text {
        color: var(--b3-theme-primary);
        background-color: transparent;
    }

    .b3-text-field {
        border: 0;
        border-radius: var(--b3-border-radius);
        outline: 1px solid var(--b3-border-color);
        outline-offset: -1px;
        box-shadow: none;
        padding: 4px 8px;
        line-height: 20px;
        box-sizing: border-box;
        color: var(--b3-theme-on-background);
        background-color: var(--b3-theme-background);
        font-family: inherit;
        font-size: 14px;
    }

    .b3-select {
        border: 0;
        border-radius: var(--b3-border-radius);
        padding: 4px 26px 4px 8px;
        box-sizing: border-box;
        line-height: 20px;
        color: var(--b3-theme-on-background);
        height: 28px;
        font-size: 14px;
        box-shadow: inset 0 0 0 1px var(--b3-border-color);
        background: var(--b3-select-background);
        appearance: none;
        cursor: pointer;
        overflow: hidden;
        font-family: inherit;
    }

    .b3-dialog__container {
        border-radius: var(--b3-border-radius-b);
        background-color: var(--b3-theme-surface);
        box-shadow: var(--b3-dialog-shadow);
        border: 1px solid var(--b3-theme-surface-lighter);
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
    }

    .b3-dialog__header {
        padding: 9px 24px;
        line-height: 24px;
        font-size: 16px;
        font-weight: 500;
        border-bottom: 1px solid var(--b3-theme-surface-lighter);
    }

    .b3-dialog__content {
        padding: 16px 24px;
        word-break: break-all;
        flex: 1;
    }

    .b3-dialog__action {
        padding: 7px 24px;
        border-top: 1px solid var(--b3-theme-surface-lighter);
        display: flex;
        align-items: center;
        justify-content: flex-end;
        box-sizing: border-box;
        user-select: none;
    }

    .b3-menu {
        border-radius: var(--b3-border-radius-b);
        box-shadow: var(--b3-dialog-shadow);
        border: 1px solid var(--b3-theme-surface-lighter);
        background-color: var(--b3-menu-background);
        padding: 8px 0;
        box-sizing: border-box;
        font-size: var(--b3-font-size);
    }

    .b3-menu__items {
        padding: 0 8px;
    }

    .b3-menu__item {
        padding: 0 8px;
        border-radius: var(--b3-border-radius);
        user-select: none;
        display: flex;
        align-items: center;
        line-height: 28px;
        white-space: nowrap;
        border: 0;
        text-align: left;
        width: 100%;
        background-color: var(--b3-menu-background);
        color: var(--b3-theme-on-background);
        position: relative;
        box-sizing: border-box;
        margin: 1px 0;
        font-family: inherit;
        font-size: inherit;
    }

    .b3-menu__item--show {
        background-color: var(--b3-list-hover);
    }

    .b3-menu__item--current {
        color: var(--b3-theme-primary);
    }

    .b3-menu__icon {
        height: 18px;
        width: 18px;
        margin: 0 12px 0 0;
    }

    .b3-menu__label {
        flex: 1;
    }

    .b3-menu__accelerator {
        font-size: .75rem;
        margin-left: 16px;
        color: var(--b3-theme-on-surface);
        font-family: var(--b3-font-family-code);
    }

    .b3-menu__separator {
        background-color: var(--b3-theme-surface-lighter);
        height: 1px;
        margin: 4px 0;
        display: block;
        border: 0;
    }

    .b3-menu__submenu {
        border: 1px solid var(--b3-theme-surface-lighter);
        border-radius: var(--b3-border-radius-b);
        background-color: var(--b3-menu-background);
        padding: 8px 0;
        box-shadow: var(--b3-dialog-shadow);
        position: absolute;
        top: -9px;
        left: 100%;
    }

    .fn__flex {
        display: flex;
    }

    .fn__block {
        width: 100%;
    }

    .fn__space {
        width: 8px;
        flex-shrink: 0;
    }

    .fn__hr {
        height: 8px;
        display: block;
    }

    .fn__hr--small {
        height: 4px;
        display: block;
    }

    .fn__code {
        padding: .2em .4em;
        margin: 0;
        font-size: 85%;
        border-radius: var(--b3-border-radius);
        font-family: var(--b3-font-family-code);
        word-break: break-word;
        white-space: pre-wrap;
        background-color: var(--b3-protyle-code-background);
    }

    .ft__on-surface {
        color: var(--b3-theme-on-surface);
    }

    .ft__smaller {
        font-size: 12px;
    }

    /* ===== 面板一：文档中的按钮块 + 块菜单 > 插件 > 编辑按钮块 ===== */
    .layout-tab-bar {
        display: flex;
        align-items: center;
        height: 41px;
        padding: 0 4px;
        background-color: var(--b3-theme-surface);
        border-bottom: 1px solid var(--b3-theme-surface-lighter);
        box-sizing: border-box;
    }

    .layout-tab-bar .item {
        display: flex;
        align-items: center;
        min-height: 29px;
        max-width: 186px;
        margin: 6px 4px;
        border-radius: var(--b3-border-radius);
        color: var(--b3-theme-on-surface);
    }

    .layout-tab-bar .item--focus {
        background-color: var(--b3-theme-surface-light);
        box-shadow: 0 0 0 1px var(--b3-border-color) inset;
    }

    .item__graphic {
        padding-left: 8px;
        height: 16px;
        width: 16px;
        flex-shrink: 0;
    }

    .item__text {
        padding: 0 8px;
        white-space: nowrap;
        overflow: hidden;
    }

    .item__close {
        padding-right: 8px;
        display: flex;
        align-items: center;
        opacity: .68;
    }

    .item__close svg {
        height: 12px;
        width: 12px;
    }

    .block__icon {
        height: 16px;
        width: 16px;
        padding: 6px;
        border-radius: var(--b3-border-radius);
        color: var(--b3-theme-on-surface);
        box-sizing: content-box;
    }

    .protyle-breadcrumb {
        display: flex;
        align-items: center;
        padding: 0 8px;
        min-height: 42px;
        font-size: 14px;
        box-sizing: border-box;
        border-bottom: 1px solid var(--b3-theme-surface-lighter);
    }

    .protyle-breadcrumb__arrow {
        height: 14px;
        width: 14px;
        padding: 0 6px;
        color: var(--b3-theme-on-surface);
    }

    .protyle-breadcrumb__text {
        padding: 0 4px;
    }

    .protyle-breadcrumb__space {
        flex: 1;
    }

    .protyle-wysiwyg {
        padding: 8px 24px 0;
    }

    .protyle-wysiwyg .h1 {
        font-size: 1.75em;
        font-weight: 600;
        line-height: 1.625;
        padding: 4px;
        margin: 2px 0;
    }

    .protyle-wysiwyg .p {
        line-height: 1.625;
        padding: 4px;
        margin: 2px 0;
    }

    [data-type="NodeCustomBlock"] {
        min-height: 32px;
        line-height: 1.625;
        padding: 4px;
        margin: 2px 0;
    }

    .protyle-attr {
        height: 16px;
    }

    .protyle-gutters {
        position: absolute;
        left: 2px;
        top: 186px;
        height: 22px;
        width: 22px;
    }

    .protyle-gutters__button {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 22px;
        width: 22px;
        padding: 0;
        border: 0;
        border-radius: var(--b3-border-radius);
        background-color: var(--b3-theme-on-surface);
        color: var(--b3-theme-surface);
        box-sizing: border-box;
    }

    .protyle-gutters__button svg {
        height: 14px;
        width: 14px;
    }

    .pane--editor .b3-menu {
        position: absolute;
        left: 236px;
        top: 196px;
        width: 196px;
    }

    /* ===== 面板二、三、四：插件对话框，在面板里垂直居中 ===== */
    .pane__dialog {
        position: absolute;
        left: 12px;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
    }

    .pane__dialog .b3-dialog__body {
        display: flex;
        flex-direction: column;
    }

    /* 图标选择对话框：照抄 src/icon.ts 生成的图标网格 */
    .bis-icon-picker {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(32px, 1fr));
        gap: 4px;
        max-height: 320px;
        overflow: hidden;
    }

    .bis-icon-picker__item {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: var(--b3-border-radius);
        background-color: transparent;
        color: var(--b3-theme-on-surface);
    }

    .bis-icon-picker__item--current {
        color: var(--b3-theme-primary);
        background-color: var(--b3-theme-primary-lightest);
    }

    .bis-script-output {
        max-height: 320px;
        overflow: hidden;
    }
</style>
</head>
