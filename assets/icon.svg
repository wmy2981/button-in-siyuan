<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Button Block">
    <title>Button Block</title>
    <!-- 由 src/buttonIcon.ts 生成，勿手改；改图形请改那个文件后重跑 scripts/render-icon.mjs。
         白底不切圆角：集市卡片自己会加 border-radius。图形在 24 单位坐标系里画好再放大 5 倍，
         线宽 1.2（160 画布上约 6px），与 editor-siyuan 的 24 单位线稿同构。
         箭头带白色细描边，把它和按钮边线分开。 -->
    <rect width="160" height="160" fill="#FFFFFF"/>
    <g transform="translate(20 20) scale(5)">
        <g fill="none" stroke="#3575F0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4.5" y="7.4" width="15" height="9.2" rx="4.6"/>
        </g>
        <path d="M8.6 12h5" fill="none" stroke="#3575F0" stroke-width="0.9" stroke-linecap="round"/>
        <path d="M15.4 11.4v6l1.4-1.4.9 2.1 1.3-.6-.9-2.1 2.1-.25z" fill="#3575F0" stroke="#FFFFFF" stroke-width=".9" stroke-linejoin="round"/>
    </g>
</svg>
