<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Button Block">
    <title>Button Block</title>
    <!-- 由 src/buttonIcon.ts 生成，勿手改；改图形请改那个文件后重跑 scripts/render-icon.mjs。
         方形满版底、不切圆角：集市卡片自己会加 border-radius。图形在 24 单位坐标系里画好再放大 5 倍，
         线宽 1.2（160 画布上约 6px），与 editor-siyuan 的 24 单位线稿同构。
         磨砂质感来自三层：浅灰渐变底、图形模糊出来的柔光、极淡的噪点；按钮内部另填一层半透明白。
         箭头带浅色外圈，把它和按钮边线切开。 -->
    <defs>
        <linearGradient id="bis-icon-surface" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FAFBFC"/>
            <stop offset="1" stop-color="#EDF0F5"/>
        </linearGradient>
        <filter id="bis-icon-glow" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="4.5"/>
        </filter>
        <filter id="bis-icon-grain" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
            <feColorMatrix type="saturate" values="0"/>
        </filter>
    </defs>
    <rect width="160" height="160" fill="url(#bis-icon-surface)"/>
    <g opacity="0.5" filter="url(#bis-icon-glow)">
        <g transform="translate(20 20) scale(5)">
        <g fill="none" stroke="#3575F0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.4" y="6.4" width="17.2" height="11.2" rx="5.6"/>
            <path d="M9 12h5.6" stroke-width="1.05"/>
            <g transform="translate(.3 .3) translate(15.4 11.4) scale(.95) translate(-15.4 -11.4)">
                <path d="M15.4 11.4v6.2l1.5-1.5.95 2.2 1.35-.62-.95-2.2 2.15-.25z" fill="#3575F0" stroke="#3575F0" stroke-width="1"/>
            </g>
        </g>
    </g>
    </g>
    <g transform="translate(20 20) scale(5)">
        <rect x="3.4" y="6.4" width="17.2" height="11.2" rx="5.6" fill="#FFFFFF" fill-opacity="0.72"/>
        <g fill="none" stroke="#3575F0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3.4" y="6.4" width="17.2" height="11.2" rx="5.6"/>
            <path d="M9 12h5.6" stroke-width="1.05"/>
            <g transform="translate(.3 .3) translate(15.4 11.4) scale(.95) translate(-15.4 -11.4)">
                <path d="M15.4 11.4v6.2l1.5-1.5.95 2.2 1.35-.62-.95-2.2 2.15-.25z" fill="#3575F0" stroke="#F6F9FC" stroke-width="2.4"/>
                <path d="M15.4 11.4v6.2l1.5-1.5.95 2.2 1.35-.62-.95-2.2 2.15-.25z" fill="#3575F0" stroke="#3575F0" stroke-width="1"/>
            </g>
        </g>
    </g>
    <rect width="160" height="160" filter="url(#bis-icon-grain)" opacity="0.06"/>
</svg>
