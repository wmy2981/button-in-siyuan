<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Button Block">
  <title>Button Block</title>
  <!-- 市集图标：纯白方底、不切圆角（集市卡片自己会加 border-radius）。
       图形画在 24 单位坐标系里再放大 5 倍，线宽 1.2（160 画布上约 6px），与
       editor-siyuan 的 24 单位线稿同构；圆角矩形是「按钮」，里面的短线是按钮文字，
       右下角的实心箭头是「点一下」的动作。 -->
  <rect width="160" height="160" fill="#FFFFFF"/>
  <g transform="translate(20 20) scale(5)">
    <g fill="none" stroke="#3575F0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.1" y="4.2" width="15" height="9.2" rx="4.6"/>
    </g>
    <!-- 按钮上的文字占位，比按钮边线更细，免得读成一条粗横杠 -->
    <path d="M6.4 8.8h6" fill="none" stroke="#3575F0" stroke-width=".9" stroke-linecap="round"/>
    <!-- 实心箭头压住按钮的右下角，白色细描边把它和按钮边线分开 -->
    <path d="M15.1 10v8.2l2-2 1.3 3 1.8-.8-1.3-3 3-.34z" fill="#3575F0" stroke="#FFFFFF" stroke-width=".8" stroke-linejoin="round"/>
  </g>
</svg>
