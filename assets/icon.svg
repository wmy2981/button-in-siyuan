<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-label="Button Block">
  <title>Button Block</title>
  <defs>
    <linearGradient id="bis-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B93FF"/>
      <stop offset="1" stop-color="#2A5ADF"/>
    </linearGradient>
    <linearGradient id="bis-pill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EBF2FF"/>
    </linearGradient>
  </defs>
  <!-- 主题色画布 -->
  <rect width="160" height="160" rx="36" fill="url(#bis-bg)"/>
  <!-- 按钮本体与文字占位 -->
  <rect x="22" y="46" width="100" height="50" rx="15" fill="url(#bis-pill)"/>
  <rect x="22" y="46" width="100" height="50" rx="15" fill="none" stroke="#2A5ADF" stroke-opacity=".16" stroke-width="2"/>
  <rect x="40" y="63" width="44" height="14" rx="7" fill="#3575F0" fill-opacity=".82"/>
  <!-- 点击指针 -->
  <g transform="translate(101 84) scale(2.5)">
    <path d="M0 0 L0 14 L3.6 10.9 L6 16 L8.6 14.9 L6.2 9.9 L11 9.9 Z"
          fill="#FFFFFF" stroke="#2A5ADF" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
</svg>
