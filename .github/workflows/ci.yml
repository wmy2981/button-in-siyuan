name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Check package contents
        run: |
          set -euo pipefail
          unzip -l package.zip
          for file in plugin.json index.js index.css icon.png i18n/en.json i18n/zh-CN.json; do
            unzip -l package.zip "$file" > /dev/null
            echo "ok: $file"
          done

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: package.zip

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 测试与静态检查分开跑：失败时能一眼看出是测试挂了还是构建/类型检查挂了
      - name: Test
        run: npm test
